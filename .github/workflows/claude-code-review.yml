name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A push while a review is still running replaces that review.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # The plugin's review is a chain of subagents. Run in the
          # background, the first one was still running when the session
          # ended its turn, and the job ended with it, before any review.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools: the gh commands the plugin's own command allows.
          # --model: on the default Sonnet, the session read the diff itself
          # and skipped the plugin's review and validation agents.
          # --append-system-prompt: `gh pr view --comments` also asks for the
          # PR's checks, which this token can't read, so the check for an
          # earlier review failed and every push posted another one.
          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --append-system-prompt "Follow every step of the review command as written, launching each agent it names; never replace them with your own reading of the diff. To read a pull request's comments, use gh pr view <number> --json comments, never gh pr view --comments, and tell every agent you launch the same."
          # Shows what Claude did in the run's log while the review is being
          # made to work; take it out once reviews land on pull requests.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
