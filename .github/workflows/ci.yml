# Checks for pushes to main and pull requests. Deploys are not here: the
# web site deploys with Cloudflare Workers Builds, which builds each push
# to main and gives each pull request a preview URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter lists a pull request's files through the API, which a
  # private repository only answers with this.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      proto: ${{ steps.filter.outputs.proto }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            typescript:
              - "apps/web/**"
              - "apps/design/**"
              - "apps/demo/**"
              - "apps/try/**"
              - "apps/server/**"
              - "apps/admin/**"
              - "packages/**"
              - "design/**"
              - "spec/design-tokens.json"
              - "spec/vectors/**"
              - "apps/ios/Packages/PochicalDesign/**"
              - "apps/android/design/**"
              - "tools/**"
              - "package.json"
              - "bun.lock"
              - "*.config.ts"
              - "lint-ignores.ts"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            proto:
              - "proto/**"
              - "apps/server/src/gen/**"
              - "apps/web/src/gen/**"
              - "apps/ios/Packages/PochicalProto/**"
              - "apps/android/proto/**"
              - "apps/ios/Packages/PochicalKit/Sources/PochicalKit/Sync.swift"
              - "apps/ios/Packages/PochicalKit/sync-wire.json"
              - "tools/sync-schema/**"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            # design/ and proto/ reach the app through the code generated
            # into apps/android.
            android:
              - "apps/android/**"
              - "mise.toml"
              - ".github/workflows/ci.yml"

  # apps/web, apps/design, apps/demo, apps/try, apps/server, apps/admin,
  # packages/ and tools/: lint
  # and format, types, tests.
  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node bun
      - run: bun install --frozen-lockfile
      # Each Worker's worker-configuration.d.ts is what its wrangler.jsonc
      # and the locked wrangler (and the workerd it pins) give, not left
      # behind by a wrangler bump. Before typecheck, which reads them.
      # wrangler types reads no account.
      - run: mise run worker-types:check
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      # The site builds, and its Worker's bundle and config validate.
      - run: bun run build && bunx wrangler deploy --dry-run
        working-directory: apps/web
      # The design, demo and try Workers build, and their configs validate.
      - run: bun run build && bunx wrangler deploy --dry-run
        working-directory: apps/design
      - run: bun run build && bunx wrangler deploy --dry-run
        working-directory: apps/demo
      - run: bun run build && bunx wrangler deploy --dry-run
        working-directory: apps/try
      # The server and admin Workers bundle and their configs validate, as
      # Workers Builds deploys them on merge. A dry run needs no account.
      - run: bunx wrangler deploy --dry-run
        working-directory: apps/server
      - run: bun run build && bunx wrangler deploy --dry-run
        working-directory: apps/admin
      # The tokens the native apps are generated from design/.
      - run: bun design/scripts/gen.ts --check
      # The migrations drizzle-kit gives from each SQL schema (D1, Group DO,
      # User DO) are all in the branch, and agree with each other.
      - run: mise run db:check

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: buf node bun
      - run: mise run proto:lint
      # The code generated from proto/ is what proto/ gives now: none edited
      # by hand, none left behind by a .proto change. protoc-gen-es comes
      # from the workspace's dependencies.
      - run: bun install --frozen-lockfile
      # buf's remote plugins (Swift, Kotlin) are fetched signed in, clear
      # of the Buf Schema Registry's limits on anonymous use.
      - env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          mise run gen:proto
          git status --porcelain
          test -z "$(git status --porcelain)"
      # The Changes the iOS app reads are those Sync.schema was raised for.
      - run: mise run sync:check
      # proto:breaking compares with the local main branch.
      - if: github.event_name == 'pull_request'
        run: |
          git branch --force main origin/main
          mise run proto:breaking

  # apps/android: the debug and release builds, unit tests and lint. The
  # runner's Android SDK has the platform and build tools the Gradle project
  # names.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: java
      # basic is the MIT-licensed cache over actions/cache; the default,
      # enhanced, is a proprietary library only in preview for private
      # repositories.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: mise run android:build
      # The minified release bundle, signed with the debug key here: R8 and
      # its rules are checked before main releases it.
      - run: mise run android:release
      - run: mise run android:test
