# Checks for pushes to main and pull requests. Deploys are not here: the
# web site deploys with Cloudflare Workers Builds, which builds each push
# to main and gives each pull request a preview URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter lists a pull request's files through the API, which a
  # private repository only answers with this.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            typescript:
              - "apps/web/**"
              - "apps/server/**"
              - "design/**"
              - "spec/design-tokens.json"
              - "spec/vectors/**"
              - "apps/ios/Packages/PochicalDesign/**"
              - "apps/android/design/**"
              - "tools/**"
              - "package.json"
              - "bun.lock"
              - "patches/**"
              - "*.config.ts"
              - "lint-ignores.ts"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            proto:
              - "proto/**"
              - "apps/server/src/gen/**"
              - "apps/web/src/gen/**"
              - "apps/ios/Packages/PochicalProto/**"
              - "apps/android/proto/**"
              - "mise.toml"
              - ".github/workflows/ci.yml"

  # apps/web and apps/server: lint and format, types, tests.
  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: bun
      # The reference-only Expo app's dependencies are left out.
      - run: bun install --frozen-lockfile --filter '!@pochical/mobile-legacy'
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      # What each web page loads before it first shows, against its budget.
      - run: bun run --cwd apps/web build
      - run: bun run --cwd apps/web bundle:budget
      # The tokens the native apps are generated from design/.
      - run: bun design/scripts/gen.ts --check

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install_args: buf bun
      - run: mise run proto:lint
      # The code generated from proto/ is what proto/ gives now: none edited
      # by hand, none left behind by a .proto change. protoc-gen-es comes
      # from the workspace's dependencies.
      - run: bun install --frozen-lockfile --filter '!@pochical/mobile-legacy'
      - run: |
          mise run gen:proto
          git status --porcelain
          test -z "$(git status --porcelain)"
      # proto:breaking compares with the local main branch.
      - if: github.event_name == 'pull_request'
        run: |
          git branch --force main origin/main
          mise run proto:breaking
