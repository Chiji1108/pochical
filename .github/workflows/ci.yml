# Checks for pushes to main and pull requests. Deploys are not here: the
# web site deploys with Cloudflare Workers Builds, which builds each push
# to main and gives each pull request a preview URL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter lists a pull request's files through the API, which a
  # private repository only answers with this.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      proto: ${{ steps.filter.outputs.proto }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            typescript:
              - "apps/web/**"
              - "apps/design/**"
              - "apps/try/**"
              - "apps/server/**"
              - "apps/admin/**"
              - "packages/**"
              - "design/**"
              - "spec/design-tokens.json"
              - "spec/vectors/**"
              - "apps/ios/Packages/PochicalDesign/**"
              - "apps/android/design/**"
              - "tools/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "*.config.ts"
              - "lint-ignores.ts"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            proto:
              - "proto/**"
              - "apps/server/src/gen/**"
              - "apps/web/src/gen/**"
              - "apps/ios/Packages/PochicalProto/**"
              - "apps/android/proto/**"
              - "apps/ios/Packages/PochicalKit/Sources/PochicalKit/Sync.swift"
              - "apps/ios/Packages/PochicalKit/sync-wire.json"
              - "apps/android/kit/src/main/kotlin/app/pochical/kit/Sync.kt"
              - "apps/android/kit/sync-wire.json"
              - "tools/sync-schema/**"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            # design/ and proto/ reach the app through the code generated
            # into apps/android; :kit's tests read spec/vectors.
            android:
              - "apps/android/**"
              - "spec/vectors/**"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            # design/ and proto/ reach the app through the code generated
            # into apps/ios; PochicalKit's tests read spec/vectors.
            ios:
              - "apps/ios/**"
              - "spec/vectors/**"
              - ".xcode-version"
              - "mise.toml"
              - ".github/workflows/ci.yml"

  # apps/web, apps/design, apps/try, apps/server, apps/admin,
  # packages/ and tools/: lint
  # and format, types, tests.
  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      # Each Worker's worker-configuration.d.ts is what its wrangler.jsonc
      # and the locked wrangler (and the workerd it pins) give, not left
      # behind by a wrangler bump. Before typecheck, which reads them.
      # wrangler types reads no account.
      - run: mise run worker-types:check
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run test
      # The site builds, and its Worker's bundle and config validate.
      - run: pnpm run build && pnpm exec wrangler deploy --dry-run
        working-directory: apps/web
      # The design and try Workers build, and their configs validate.
      - run: pnpm run build && pnpm exec wrangler deploy --dry-run
        working-directory: apps/design
      - run: pnpm run build && pnpm exec wrangler deploy --dry-run
        working-directory: apps/try
      # The server and admin Workers bundle and their configs validate, as
      # Workers Builds deploys them on merge. A dry run needs no account.
      - run: pnpm exec wrangler deploy --dry-run
        working-directory: apps/server
      - run: pnpm run build && pnpm exec wrangler deploy --dry-run
        working-directory: apps/admin
      # The tokens the native apps are generated from design/.
      - run: mise run design:check
      # The migrations drizzle-kit gives from each SQL schema (D1, Group DO,
      # User DO) are all in the branch, and agree with each other.
      - run: mise run db:check

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: buf node pnpm
      - run: mise run proto:lint
      # The code generated from proto/ is what proto/ gives now: none edited
      # by hand, none left behind by a .proto change. protoc-gen-es comes
      # from the workspace's dependencies.
      - run: pnpm install --frozen-lockfile
      # buf's remote plugins (Swift, Kotlin) are fetched signed in, clear
      # of the Buf Schema Registry's limits on anonymous use.
      - env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: |
          mise run gen:proto
          git status --porcelain
          test -z "$(git status --porcelain)"
      # The Changes the iOS app reads are those Sync.schema was raised for.
      - run: mise run sync:check
      # proto:breaking compares with the local main branch.
      - if: github.event_name == 'pull_request'
        run: |
          git branch --force main origin/main
          mise run proto:breaking

  # apps/android: the debug and release builds, unit tests and lint. The
  # runner's Android SDK has the platform and build tools the Gradle project
  # names.
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: java
      # basic is the MIT-licensed cache over actions/cache; the default,
      # enhanced, is a proprietary library only in preview for private
      # repositories.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: mise run android:build
      # The minified release bundle, signed with the debug key here: R8 and
      # its rules are checked before main releases it.
      - run: mise run android:release
      - run: mise run android:test
      # Against the PR's base, main or the PR it stacks on, so a version that base has keeps its shape.
      - if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          BASE="origin/$GITHUB_BASE_REF" mise run android:db:check
      # On main, against the commit before the push.
      - if: github.event_name == 'push'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
          BASE="${{ github.event.before }}" mise run android:db:check

  # apps/ios: the app with its extensions, built for devices with the
  # scheme's Debug configuration, unsigned; and the packages' tests,
  # spec/vectors among them. xcode-27 is the free standard runner of the
  # macOS that Xcode 27 needs, and .xcode-version picks the Xcode on it.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # ios:test needs none of mise.toml's tools.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch "/Applications/Xcode_$(cat .xcode-version).app"
      # The packages' checkouts and the builds made from them, the macros'
      # swift-syntax above all, for each Xcode and set of resolved packages.
      # The app's own sources build anew each time, as a checkout gives them
      # new dates. Only main saves, so a pull request reads main's.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ios
            apps/ios/Packages/*/.build
          key: ios-${{ hashFiles('.xcode-version', 'apps/ios/**/Package.resolved') }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
      # -skipMacroValidation and -skipPackagePluginValidation: no one is
      # here to trust the packages' macros and plugins, as Xcode asks once.
      - run: >-
          xcodebuild build -project apps/ios/Pochical/Pochical.xcodeproj -scheme Pochical -destination generic/platform=iOS -derivedDataPath ${{ runner.temp }}/ios/DerivedData -clonedSourcePackagesDirPath ${{ runner.temp }}/ios/SourcePackages -skipMacroValidation -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - run: mise run ios:test
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ios
            apps/ios/Packages/*/.build
          key: ${{ steps.cache.outputs.cache-primary-key }}
