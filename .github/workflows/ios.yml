# The `ios` commit status main requires: Xcode Cloud has verified the iOS
# files of a pull request's head (.github/scripts/ios-gate.sh). Xcode Cloud
# builds only pull requests that change them, and on the others leaves its
# check suite queued for good, so it cannot be required itself. The status
# is set again on each push, and each time Xcode Cloud finishes a check run.
#
# A status belongs to a commit, not to a pull request, and only main
# requires it, so the head is only ever judged against main. A pull request
# retargeted away from main keeps the status main judged, which no ruleset
# then reads; retargeted to main, it is judged again.
#
# Both triggers run this file and the script as main has them, never as
# the pull request has them, so a pull request cannot grant itself
# the status. Nothing from the head is checked out or run: the script only
# reads its trees.
name: iOS

on:
  pull_request_target:
    # The default branch. A filter cannot name it as such, so the job checks
    # the base against it too.
    branches: [main]
    # edited: a pull request retargeted to main.
    types: [opened, synchronize, reopened, edited]
  check_run:
    types: [completed]

permissions: {}

# Xcode Cloud's GitHub App and its pull request workflow. The app id is also
# in the job's `if` and the concurrency group, which cannot read env.
env:
  XCODE_CLOUD_APP: 117084
  XCODE_CLOUD_WORKFLOW: "Pochical | PRのテスト"

# One head at a time, so the last run to write reads Xcode Cloud last. Check
# runs of other apps, which this job skips, get a group of their own so
# they cannot cancel a waiting run.
concurrency:
  group: >-
    ios-${{ (github.event_name == 'check_run' && github.event.check_run.app.id != 117084) && github.run_id || github.event.pull_request.head.sha || github.event.check_run.head_sha }}

jobs:
  gate:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch && (github.event.action != 'edited' || github.event.changes.base)) || github.event.check_run.app.id == 117084
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      # Which pull request a check run's commit is the head of.
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      # main, for this file's script.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Set the ios status
        run: |
          # A check run names a commit, not a pull request: act only when the
          # commit is the head of an open pull request into main.
          if [ "$GITHUB_EVENT_NAME" = check_run ]; then
            heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.state == "open" and .head.sha == env.HEAD_SHA and .base.ref == env.BASE)] | length')
            if [ "$heads" = 0 ]; then
              echo "$HEAD_SHA is no open pull request's head into $BASE"
              exit
            fi
          fi
          verdict=$(.github/scripts/ios-gate.sh "$HEAD_SHA" "$BASE")
          read -r state description <<<"$verdict"
          echo "$state: $description"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context=ios -f state="$state" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
