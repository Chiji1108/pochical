name: Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  server-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node bun
      - run: bun install --frozen-lockfile
      - name: DO call latency beside the suite, per file isolation and without
        working-directory: apps/server
        run: |
          for mode in isolate no-isolate isolate no-isolate isolate no-isolate; do
            echo "=== $mode"
            ./node_modules/.bin/vitest run -c vitest.probe.config.ts --maxWorkers=4 --$mode 2>&1 \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | grep -E '"calls"|"worst"|Z [0-9]+ms|lag\] worst|^ +Tests |Duration|×' || true
          done
