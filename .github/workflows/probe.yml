name: Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  server-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node bun
      - run: bun install --frozen-lockfile
      - run: nproc; free -m
      - name: suite, 6 times, with the main process's lag and vmstat
        working-directory: apps/server
        run: |
          vmstat -t 1 > /tmp/vmstat.log &
          for i in 1 2 3 4 5 6; do
            echo "=== run $i"
            ./node_modules/.bin/vitest run -c vitest.probe.config.ts 2>&1 \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | grep -E '\[lag\]|^ +Tests |Duration|×|[0-9]{4,}ms$|FAIL' || true
          done
          kill %1
          echo "=== vmstat rows with steal or wait over 10, or idle under 5"
          awk 'NR>2 && ($16 > 10 || $17 > 10 || $15 < 5)' /tmp/vmstat.log | head -80
