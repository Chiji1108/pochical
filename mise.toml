[tools]
buf = "1.74.0"
java = "temurin-21.0.12+101.0.LTS"

[settings]
# Node's version is in .node-version and pnpm's in package.json's
# packageManager, both of which Workers Builds reads too.
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tasks.gen]
description = "Generate the code made from proto/ and design/, and the Workers' types"
depends = ["gen:proto", "gen:design", "gen:worker-types"]

[tasks."gen:proto"]
description = "Generate TypeScript, Swift and Kotlin code from proto/"
dir = "{{config_root}}/proto"
run = "buf generate"

[tasks."gen:design"]
description = "Write design/'s tokens out as JSON, Swift and Kotlin"
run = "pnpm exec tsx design/scripts/gen.ts"

[tasks."design:check"]
description = "Fail if the code generated from design/ is out of date"
run = "pnpm exec tsx design/scripts/gen.ts --check"

[tasks."gen:worker-types"]
description = "Write each Worker's worker-configuration.d.ts (every workspace's cf-typegen) from its wrangler.jsonc, with the wrangler in pnpm-lock.yaml"
# Each cf-typegen deletes the file first. Otherwise wrangler keeps the
# runtime types already in it whenever its workerd header line matches,
# and a file changed below that line would pass worker-types:check.
run = "pnpm -r cf-typegen"

[tasks."worker-types:check"]
description = "Fail if a Worker's worker-configuration.d.ts is not what gen:worker-types writes"
depends = ["gen:worker-types"]
run = '''
changed=$(git status --porcelain -- '*/worker-configuration.d.ts')
if [ -n "$changed" ]; then
  printf '%s\n' "$changed"
  echo "worker-configuration.d.ts is out of date: run mise run gen:worker-types and commit it (AGENTS.md)."
  exit 1
fi
'''

[tasks."proto:lint"]
description = "Lint and format-check proto/"
dir = "{{config_root}}/proto"
run = ["buf lint", "buf format --diff --exit-code"]

[tasks."proto:breaking"]
description = "Fail on wire-incompatible proto changes against main"
dir = "{{config_root}}/proto"
run = "buf breaking --against '../.git#branch=main,subdir=proto'"

[tasks."sync:check"]
description = "Fail if the Changes the apps read changed without raising their sync schema, iOS's Sync.schema and Android's SYNC_SCHEMA (--write records it once raised)"
run = [
  "pnpm exec vitest run tools/sync-schema",
  "pnpm exec tsx tools/sync-schema/check.ts",
]

[tasks.server]
description = "Run the Workers dev server: [--port <port>, 8787 by default] [more wrangler dev flags]"
usage = '''
flag "--port <port>" default="8787"
arg "[wrangler]..." help="passed on to wrangler dev" var=#true
'''
run = 'pnpm --dir apps/server dev --port {{usage.port}} --var BETTER_AUTH_URL:http://localhost:{{usage.port}} {% for a in usage.wrangler %}{{ a | quote }} {% endfor %}'

[tasks.admin]
description = "Run the admin site's dev server, beside mise run server"
run = "pnpm --dir apps/admin dev"

[tasks.design]
description = "Run the design documents' and /demo's dev server at http://localhost:3200"
run = "pnpm --dir apps/design dev"

[tasks.try]
description = "Run the app to try's dev server at http://localhost:3202"
run = "pnpm --dir apps/try dev"

[tasks."db:generate"]
description = "Generate a D1 migration from apps/server/src/db/schema.ts (pass --name <what>)"
run = "pnpm --dir apps/server db:generate"

[tasks."group-do:generate"]
description = "Generate a Group DO migration from apps/server/src/group-do-schema.ts (pass --name <what>)"
run = "pnpm --dir apps/server group-do:generate"

[tasks."user-do:generate"]
description = "Generate a User DO migration from apps/server/src/user-do-schema.ts (pass --name <what>)"
run = "pnpm --dir apps/server user-do:generate"

[tasks."db:check"]
description = "Fail if a Drizzle schema (D1, Group DO, User DO) has changes its migrations lack, or its migrations disagree"
dir = "{{config_root}}/apps/server"
# Without a terminal, drizzle-kit cannot ask whether a change is a rename:
# it prints the error and still exits 0. So only its "nothing to migrate"
# passes, and so does nothing written to the migrations' folders.
run = '''
set -eu
folders="migrations src/group-do-migrations src/user-do-migrations"
before=$(git status --porcelain -- $folders)
for config in drizzle.config.ts drizzle.group-do.config.ts drizzle.user-do.config.ts; do
  out=$(pnpm exec drizzle-kit generate --config "$config" < /dev/null 2>&1)
  case "$out" in
    *"No schema changes, nothing to migrate"*) ;;
    *) printf '%s\n' "$out"; echo "$config: the schema has changes no migration holds; run its generate task (AGENTS.md)."; exit 1 ;;
  esac
  pnpm exec drizzle-kit check --config "$config" < /dev/null
done
if [ "$(git status --porcelain -- $folders)" != "$before" ]; then
  git status --porcelain -- $folders
  echo "drizzle-kit wrote migrations the branch lacks."
  exit 1
fi
'''

[tasks."auth:schema"]
description = "Rewrite apps/server/src/db/auth-schema.ts from better-auth's options; then run db:generate"
run = "pnpm --dir apps/server auth:schema"

[tasks."server:test"]
description = "Run server tests in the Workers runtime"
run = "pnpm --dir apps/server test"

[tasks."ios:test"]
description = "Run the iOS packages' tests on this Mac, spec/vectors among them"
run = [
  "swift test --package-path apps/ios/Packages/PochicalDesign",
  "swift test --package-path apps/ios/Packages/PochicalKit",
]

[tasks."android:build"]
description = "Build the Android app's debug APK"
dir = "{{config_root}}/apps/android"
run = "./gradlew assembleDebug"

[tasks."android:release"]
description = "Build the Android app's minified release bundle (AAB), signed with the upload key when one is given, else the debug key"
dir = "{{config_root}}/apps/android"
run = "./gradlew bundleRelease"

[tasks."android:test"]
description = "Run the Android modules' unit tests and lint"
dir = "{{config_root}}/apps/android"
run = "./gradlew test lint"

[tasks."android:widget-previews"]
description = "Draw the widget picker's pictures before Android 15 (previewImage), light and dark, from the widgets themselves (spec/widgets.md)"
dir = "{{config_root}}/apps/android"
env = { WIDGET_PREVIEWS_OUT = "{{config_root}}/apps/android/app/src/main/res" }
# Without the configuration cache, which could keep the test task from an ordinary run without the folder.
run = "./gradlew :app:testDebugUnitTest --tests app.pochical.widgets.WidgetPreviewImages --rerun --no-configuration-cache"

[tasks."android:db:check"]
description = "Fail if a database version's schema Room exports changed shape (its identity hash) since the branch's base, or as built and not committed, or wrote one not committed (run after a build; BASE: the commit to compare with, by default where the branch left origin/main)"
run = """
status=0
hash() { grep -o '"identityHash": *"[^"]*"' | head -1; }
# A version the base has already is out there (on main, or on the PR the branch stacks on): its
# shape stays as it was, and a new shape takes a new version.
base="${BASE:-$(git merge-base HEAD origin/main)}"
for file in $(git ls-tree -r --name-only "$base" -- apps/android/kit/schemas); do
  if [ "$(git show "$base:$file" | hash)" != "$(git show "HEAD:$file" 2>/dev/null | hash)" ]; then
    echo "$file: the database's shape changed under a version $base has already. Raise AppDatabase.VERSION and leave this file as it was (AGENTS.md)."
    status=1
  fi
done
for file in $(git diff --name-only -- apps/android/kit/schemas); do
  if [ "$(git show "HEAD:$file" | hash)" != "$(hash < "$file")" ]; then
    echo "$file: the database's shape changed under the same version. Raise AppDatabase.VERSION, which erases the database until release, and commit kit/schemas (AGENTS.md)."
  else
    echo "$file: Room wrote the same shape anew; commit it."
  fi
  status=1
done
for file in $(git ls-files --others --exclude-standard -- apps/android/kit/schemas); do
  echo "$file: a new database version's schema; commit it."
  status=1
done
exit $status
"""

[tasks."ios:photo-touches"]
description = "Run the chat photo line's touch UI tests in a simulator, erasing it, against a server it starts at POCHICAL_DEV_SERVER (:8787 by default): <simulator name> [derived data]"
run = "tools/photo-line-touches/run.sh"

[tasks."ios:notification-taps"]
description = "Run the chat notification tap UI tests in a simulator, erasing it, against a server it starts at POCHICAL_DEV_SERVER (:8787 by default): <simulator name> [derived data]"
run = "tools/notification-taps/run.sh"

[tasks."ios:shifts-rotation"]
description = "Run a big group's 一覧 rotation UI tests in a simulator, erasing it, against a server it starts at POCHICAL_DEV_SERVER (:8787 by default): <simulator name> [derived data]"
run = "tools/shifts-rotation/run.sh"

[tasks."server:typecheck"]
description = "Typecheck the server"
run = "pnpm --dir apps/server typecheck"

[tasks."design:layout"]
description = "Measure the design documents' pages, or compare them with a saved run: save <name> | check <name> (needs mise run design)"
run = "node tools/layout-diff/index.ts --pages design"

[tasks."design:demo-layout"]
description = "Measure /demo's screens and page, or compare them with a saved run: save <name> | check <name> (needs mise run design)"
run = "node tools/layout-diff/index.ts --pages demo"

[tasks."api:try"]
description = "Try the server's groups and invitations by hand: create [name] [emoji] | join | preview | remake | cleanup [--local]"
run = "pnpm exec tsx tools/api-try/index.ts"

