[tools]
bun = "1.4.2"
buf = "1.73.0"
java = "temurin-21"

[tasks.gen]
description = "Generate the code made from proto/ and design/"
depends = ["gen:proto", "gen:design"]

[tasks."gen:proto"]
description = "Generate TypeScript, Swift and Kotlin code from proto/"
dir = "{{config_root}}/proto"
run = "buf generate"

[tasks."gen:design"]
description = "Write design/'s tokens out as JSON, Swift and Kotlin"
run = "bun design/scripts/gen.ts"

[tasks."design:check"]
description = "Fail if the code generated from design/ is out of date"
run = "bun design/scripts/gen.ts --check"

[tasks."proto:lint"]
description = "Lint and format-check proto/"
dir = "{{config_root}}/proto"
run = ["buf lint", "buf format --diff --exit-code"]

[tasks."proto:breaking"]
description = "Fail on wire-incompatible proto changes against main"
dir = "{{config_root}}/proto"
run = "buf breaking --against '../.git#branch=main,subdir=proto'"

[tasks.server]
description = "Run the Workers dev server"
run = "bun run --cwd apps/server dev"

[tasks."db:generate"]
description = "Generate a D1 migration from apps/server/src/db/schema.ts (pass --name <what>)"
run = "bun run --cwd apps/server db:generate"

[tasks."server:test"]
description = "Run server tests in the Workers runtime"
run = "bun run --cwd apps/server test"

[tasks."server:typecheck"]
description = "Typecheck the server"
run = "bun run --cwd apps/server typecheck"

[tasks."web:layout"]
description = "Measure the /design demo's screens, or compare them with a saved run: save <name> | check <name> (needs the web dev server)"
run = "bun tools/layout-diff/index.ts"

[tasks."roster-eval"]
description = "Compare vision models reading the roster photos in assets/shift-schedule (costs money)"
run = "bun tools/roster-eval/eval.ts"
