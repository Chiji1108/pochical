# Globs match by doublestar, so "**/*.ts" takes files at the root too.
glob_matcher: doublestar

pre-commit:
  jobs:
    - name: ultracite fix
      # Oxlint fails a commit staging only what lint-ignores.ts skips unless
      # told that unmatched paths are fine. Those paths are skipped there, so
      # they are not listed here again. The globs are every type oxfmt or
      # oxlint takes in this repository, as `ultracite check` covers them.
      run: |
        # GUI Git clients may not load the shell's mise/proto/Bun PATH settings.
        export PATH="$HOME/.local/share/mise/shims:$PATH:${PROTO_HOME:-$HOME/.proto}/shims:${BUN_INSTALL:-$HOME/.bun}/bin"
        bun x ultracite fix --no-error-on-unmatched-pattern {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.mjs"
        - "**/*.cjs"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.mts"
        - "**/*.cts"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.json5"
        - "**/*.css"
        - "**/*.md"
        - "**/*.astro"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.toml"
      stage_fixed: true
    - name: buf format and lint
      root: proto/
      run: |
        export PATH="$HOME/.local/share/mise/shims:$PATH"
        buf format -w && buf lint
      glob: "**/*.proto"
      stage_fixed: true
