# Globs match by doublestar, so "**/*.ts" takes files at the root too.
glob_matcher: doublestar

pre-commit:
  jobs:
    - name: ultracite fix
      # What `ultracite fix` runs, but with oxfmt told too that files all
      # skipped are fine: ultracite passes no flags to oxfmt, which then
      # fails a commit staging only what lint-ignores.ts skips. Those paths
      # are skipped there, so they are not listed here again.
      run: |
        # GUI Git clients may not load the shell's mise/proto/Bun PATH settings.
        export PATH="$HOME/.local/share/mise/shims:$PATH:${PROTO_HOME:-$HOME/.proto}/shims:${BUN_INSTALL:-$HOME/.bun}/bin"
        bun x oxlint --fix --no-error-on-unmatched-pattern {staged_files} && bun x oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.json5"
        - "**/*.css"
        - "**/*.md"
        - "**/*.astro"
      stage_fixed: true
    - name: buf format and lint
      root: proto/
      run: |
        export PATH="$HOME/.local/share/mise/shims:$PATH"
        buf format -w && buf lint
      glob: "**/*.proto"
      stage_fixed: true
