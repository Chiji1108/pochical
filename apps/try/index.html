<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- Under the device's own bars, kept clear with its safe areas, and no
         zooming in when a field smaller than 16px takes focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- A prototype, not a page for search. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Added to the home screen, it opens as an app of its own, with the
         name, icons and launch images pnpm run icon:app draws. -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The bar keeps its own strip in theme-color, with dark or light text
         to match. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
