[versions]
# The JDK every module compiles with and targets, mise.toml's java.
jvm = "21"
compileSdk = "37"
minSdk = "29"
agp = "9.4.1"
kotlin = "2.4.21"
# protobuf's Java and Kotlin runtimes for the protoc v36.2 plugins in
# proto/buf.gen.yaml, and connect-kotlin for its v0.9.0 plugin: they move
# with buf.gen.yaml and mise run gen.
protobuf = "4.36.2"
connect = "0.9.0"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
navigation3 = "1.2.0"
metro = "1.4.5"
kotlinx-serialization = "1.12.0"
junit = "4.13.2"
datastore = "1.3.0"
splashscreen = "1.2.0"
robolectric = "4.17"
lifecycle = "2.11.0"
coroutines = "1.11.0"

[libraries]
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }
connect-kotlin = { module = "com.connectrpc:connect-kotlin", version.ref = "connect" }
connect-kotlin-google-javalite-ext = { module = "com.connectrpc:connect-kotlin-google-javalite-ext", version.ref = "connect" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-animation-core = { module = "androidx.compose.animation:animation-core" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
metrox-android = { module = "dev.zacsweers.metro:metrox-android", version.ref = "metro" }
junit = { module = "junit:junit", version.ref = "junit" }
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
