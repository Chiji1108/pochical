[versions]
# The JDK every module compiles with and targets, mise.toml's java.
jvm = "21"
compileSdk = "37"
minSdk = "29"
agp = "9.4.1"
kotlin = "2.4.21"
# protobuf's Java and Kotlin runtimes for the protoc v36.2 plugins in
# proto/buf.gen.yaml, and connect-kotlin for its v0.9.0 plugin: they move
# with buf.gen.yaml and mise run gen.
protobuf = "4.36.2"
connect = "0.9.0"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
navigation3 = "1.2.0"
metro = "1.4.5"
kotlinx-serialization = "1.12.0"
junit = "4.13.2"
datastore = "1.3.0"
splashscreen = "1.2.0"
robolectric = "4.17"
lifecycle = "2.11.0"
coroutines = "1.11.0"
# Room 3 generates its code with KSP2, whose versions no longer follow Kotlin's.
room = "3.0.3"
ksp = "2.3.12"
okhttp = "5.5.0"
work = "2.12.0"
blockstore = "16.4.0"
credentials = "1.6.0"
googleid = "1.2.1"
# Auth Tab, in which Sign in with Apple opens Apple's web page.
browser = "1.10.0"
# The system's emoji picker, for a group's mark beyond those offered first.
emojipicker = "1.7.0"
# ZXing's encoder, for an invitation's QR code.
zxing = "3.5.4"
# CameraX, whose analyzer hands the camera's frames to ML Kit for QR codes.
camerax = "1.6.2"
# ML Kit's barcode scanning with its model in the app, not downloaded by Play services.
mlkit-barcode = "17.3.0"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }
connect-kotlin = { module = "com.connectrpc:connect-kotlin", version.ref = "connect" }
connect-kotlin-google-javalite-ext = { module = "com.connectrpc:connect-kotlin-google-javalite-ext", version.ref = "connect" }
connect-kotlin-okhttp = { module = "com.connectrpc:connect-kotlin-okhttp", version.ref = "connect" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-animation-core = { module = "androidx.compose.animation:animation-core" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
metrox-android = { module = "dev.zacsweers.metro:metrox-android", version.ref = "metro" }
junit = { module = "junit:junit", version.ref = "junit" }
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
blockstore = { module = "com.google.android.gms:play-services-auth-blockstore", version.ref = "blockstore" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
emojipicker = { module = "androidx.emoji2:emoji2-emojipicker", version.ref = "emojipicker" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
camerax-mlkit = { module = "androidx.camera:camera-mlkit-vision", version.ref = "camerax" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }
