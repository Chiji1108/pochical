# The newest Android Robolectric 4.17 runs; it cannot yet run compileSdk 37.
sdk=36
# Without the app's graph, which would start the kit for real (TestApplication).
application=app.pochical.TestApplication
# A phone's window, as the screens are laid out for, rather than Robolectric's 320×470dp, narrower
# than a phone (spec/calendar.md, In a narrow window); a test of another size sets its own.
qualifiers=w411dp-h891dp
