syntax = "proto3";

package pochical.v1;

// Making groups and getting into them. Every call needs the session token
// from better-auth as `Authorization: Bearer <token>` (UNAUTHENTICATED
// without one). Names follow spec/text-limits.md, counted in characters as
// a reader sees them; a longer or empty one fails with INVALID_ARGUMENT.
service GroupService {
  // Makes a group with the caller as its first member, and its first
  // invitation link. Repeating it with the same request_id changes nothing
  // and answers the same.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);

  // The group's live invitation code. Members only (PERMISSION_DENIED
  // otherwise).
  rpc GetInviteLink(GetInviteLinkRequest) returns (GetInviteLinkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Replaces the group's invitation code: the old link and QR code stop
  // working at once; members stay. Members only.
  rpc RemakeInviteLink(RemakeInviteLinkRequest) returns (RemakeInviteLinkResponse);

  // Who is in the group a live code opens, for the join screen to show
  // before joining. Signed in only: the public preview
  // (InviteService.GetInvitePreview) gives no names. NOT_FOUND when no
  // group uses the code.
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Joins the group a live code opens. NOT_FOUND when no group uses it;
  // RESOURCE_EXHAUSTED when it already has its most members
  // (GROUP_MAX_MEMBERS in design/src/limits.ts).
  // Joining a group you are already in changes nothing and says so.
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);

  // Gives the group a new name and mark, which every member sees. Members
  // only.
  rpc RenameGroup(RenameGroupRequest) returns (RenameGroupResponse);

  // How the caller appears in the group from now on. Members only.
  rpc SetDisplayName(SetDisplayNameRequest) returns (SetDisplayNameResponse);

  // The caller's photo in the group from now on: their usual one, one of
  // the group's photos they uploaded, or none. Members only.
  rpc SetGroupPhoto(SetGroupPhotoRequest) returns (SetGroupPhotoResponse);

  // Takes the caller out of the group: what it holds of their shifts goes,
  // and its socket and calls refuse them until they join again by a live
  // link. Leaving a group you are not in changes nothing.
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
}

message CreateGroupRequest {
  // groupName: 1 to 30 characters.
  string name = 1;
  // The group's mark: one emoji. Other marks come later.
  string emoji = 2;
  // How the caller appears in this group, at most personName characters:
  // their usual name, which it then follows, or one of its own; empty for
  // the usual one. A caller with no usual name gives one, and it becomes
  // their usual name (spec/sync-protocol.md, Profile).
  string display_name = 3;
  // An id the app makes once for each group it sets out to create, up to
  // syncLimits.idLength characters without spaces, and sends again with
  // every retry: the same id from the same user gives back the group it
  // made the first time, unchanged, so a retry after a lost answer never
  // makes a second group. INVALID_ARGUMENT when missing or malformed.
  string request_id = 4;
}

message CreateGroupResponse {
  string group_id = 1;
  string invite_code = 2;
}

message GetInviteLinkRequest {
  string group_id = 1;
}

message GetInviteLinkResponse {
  string invite_code = 1;
}

message RemakeInviteLinkRequest {
  string group_id = 1;
}

message RemakeInviteLinkResponse {
  string invite_code = 1;
}

message GetInviteRequest {
  string invite_code = 1;
}

message GetInviteResponse {
  string group_id = 1;
  string group_name = 2;
  // The group's mark when it is an emoji; empty for other marks.
  string group_emoji = 3;
  // Everyone in the group, in the order they joined.
  repeated InviteMember members = 4;
  // The caller is in the group already.
  bool already_member = 5;
  // The group has its most members; joining would fail.
  bool full = 6;
}

// Someone in a group, as the join screen shows them.
message InviteMember {
  string display_name = 1;
  // Their photo as the group shows it, read by the code's holder at
  // /v1/invites/{code}/photos/{id}; empty for none.
  string photo_id = 2;
}

message JoinGroupRequest {
  string invite_code = 1;
  // As CreateGroupRequest's display_name.
  string display_name = 2;
}

message JoinGroupResponse {
  string group_id = 1;
  // The caller was in the group already; nothing changed.
  bool already_member = 2;
}

message RenameGroupRequest {
  string group_id = 1;
  // groupName: 1 to 30 characters.
  string name = 2;
  // The group's mark: one emoji.
  string emoji = 3;
}

message RenameGroupResponse {}

message SetGroupPhotoRequest {
  string group_id = 1;
  // Follow the usual photo; photo_id is then ignored.
  bool usual = 2;
  // One of the group's photos the caller uploaded, or empty for none.
  string photo_id = 3;
}

message SetGroupPhotoResponse {}

message SetDisplayNameRequest {
  string group_id = 1;
  // A name of the caller's own for this group, at most personName
  // characters; empty, or their usual name, to follow the usual one again.
  string display_name = 2;
}

message SetDisplayNameResponse {}

message LeaveGroupRequest {
  string group_id = 1;
}

message LeaveGroupResponse {}
