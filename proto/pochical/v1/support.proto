syntax = "proto3";

package pochical.v1;

import "pochical/v1/sync.proto";

// The chat with the people who make Pochical (/design's SupportChatPage):
// a user's own, read and answered by Pochical's people, who answer under
// the app's name. Signed-in users only; each sees only their own.
service SupportService {
  // The user's chat with Pochical's people, oldest first, and how many of
  // the answers the user has not read.
  rpc GetSupportChat(GetSupportChatRequest) returns (GetSupportChatResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A line to Pochical's people: words, or a photo. The id is the app's,
  // so a send tried again is kept once. INVALID_ARGUMENT for no words or
  // more than textLimits.chatMessage, or words with a photo;
  // RESOURCE_EXHAUSTED past the limiter.
  rpc SendSupportMessage(SendSupportMessageRequest) returns (SendSupportMessageResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // The answers so far are read, as the chat is open.
  rpc MarkSupportRead(MarkSupportReadRequest) returns (MarkSupportReadResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // The user's reaction on a line, put on or taken off. NOT_FOUND for a
  // line not in their chat or taken back; INVALID_ARGUMENT for anything
  // but one emoji.
  rpc ReactSupport(ReactSupportRequest) returns (ReactSupportResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // One of the user's own lines taken back: its words, reactions and reply
  // go, from Pochical's people's chat too. NOT_FOUND for a line not theirs.
  rpc UnsendSupportMessage(UnsendSupportMessageRequest) returns (UnsendSupportMessageResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// A line of the chat.
message SupportMessage {
  string id = 1;
  // Written by Pochical's people, not the user.
  bool from_support = 2;
  // Empty once taken back.
  string text = 3;
  int64 sent_at_ms = 4;
  // The line it is a reply to, by id; empty when none, or taken back.
  string reply_to = 5;
  // Taken back by its writer.
  bool unsent = 6;
  // Each emoji on it, and who put it there; none once taken back.
  repeated SupportReaction reactions = 7;
  // A photo, as the line instead of words; uploaded to the user's support
  // photos (PUT /v1/support/photos/{id}) before the line is sent, read
  // from there (GET). None once taken back.
  ChatPhoto photo = 8;
}

// An emoji on a line, put there by the user, by Pochical's people, or by
// both.
message SupportReaction {
  string emoji = 1;
  bool mine = 2;
  bool support = 3;
}

message GetSupportChatRequest {}

message GetSupportChatResponse {
  repeated SupportMessage messages = 1;
  // Answers after the user last read the chat.
  int32 unread = 2;
}

message SendSupportMessageRequest {
  // The app's own id for the line, a UUID.
  string id = 1;
  string text = 2;
  // The app's version and the device, as the chat's head says reach
  // Pochical's people with what is written: ポチカル 1.0・iPhone (iOS 26.0).
  string device = 3;
  // The line it is a reply to, by id, when it is one; one not in the chat
  // is left out.
  string reply_to = 4;
  // A photo already uploaded, sent with no words. FAILED_PRECONDITION
  // while it is not uploaded.
  ChatPhoto photo = 5;
}

message SendSupportMessageResponse {
  SupportMessage message = 1;
}

message MarkSupportReadRequest {}

message MarkSupportReadResponse {}

message ReactSupportRequest {
  // The line, by id.
  string id = 1;
  string emoji = 2;
  // Put on, or taken off.
  bool on = 3;
}

message ReactSupportResponse {
  SupportMessage message = 1;
}

message UnsendSupportMessageRequest {
  string id = 1;
}

message UnsendSupportMessageResponse {
  SupportMessage message = 1;
}
