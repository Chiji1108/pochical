syntax = "proto3";

package pochical.v1;

import "pochical/v1/chat.proto";
import "pochical/v1/marks.proto";

// Every binary WebSocket message from a client is one ClientFrame.
message ClientFrame {
  oneof kind {
    Hello hello = 1;
    Ping ping = 2;
    // The owner's own day edits, from their outbox; User DO socket only.
    DayEdits day_edits = 3;
    // The owner's pattern edits, from the same outbox; User DO socket only.
    PatternEdits pattern_edits = 4;
    // The owner's repeating orders, from the same outbox; User DO socket
    // only.
    RepeatOrdersEdits repeat_orders_edits = 5;
    // The owner's coworkers, from the same outbox; User DO socket only.
    CoworkerEdits coworker_edits = 6;
    // A member's lines and read marks in the group's chats, from their
    // outbox; Group DO socket only (spec/sync-protocol.md, Chat).
    ChatEdits chat_edits = 7;
    // Asks for a page of a chat's earlier lines; Group DO socket only.
    ChatPageRequest chat_page_request = 8;
    // The member is writing in a chat, or stopped; Group DO socket only.
    // Relayed as it comes and never kept (spec/sync-protocol.md, Typing).
    Typing typing = 9;
    // The owner's preferences, from the same outbox; User DO socket only.
    PreferenceEdits preference_edits = 10;
  }
}

// Every binary WebSocket message from the server is one ServerFrame.
message ServerFrame {
  oneof kind {
    Welcome welcome = 1;
    Pong pong = 2;
    ServerError error = 3;
    // Changes to the DO's data in cursor order, after Welcome and as they
    // happen.
    Changes changes = 4;
    // The edits of a DayEdits, PatternEdits, RepeatOrdersEdits or
    // CoworkerEdits the server has taken, sent after the Changes they made;
    // the client deletes them from its outbox.
    Acked acked = 5;
    // The client's cursor is ahead of the server's: drop this DO's cache.
    // A Changes with everything the DO holds follows.
    Reset reset = 6;
    // A page of a chat's lines, answering a ChatPageRequest.
    ChatPage chat_page = 7;
    // Someone else is writing in a chat the device may read, or stopped.
    Typing typing = 8;
    // Pochical's people answered in the user's chat with them, or reacted
    // or took a line back, on the user's own socket: the chat, if open,
    // reads itself again.
    SupportAnswered support_answered = 9;
  }
}

// A change by Pochical's people in the chat with them
// (proto/pochical/v1/support.proto), told to the user's devices as made.
message SupportAnswered {}

// Someone writing in a chat, or no longer (spec/sync-protocol.md,
// Typing): sent at most every chatRules.typingSendMs while writing, and
// shown for chatRules.typingShowMs unless sent again.
message Typing {
  string thread_id = 1;
  // Who is writing; set by the group as it relays, ignored from a client.
  string user_id = 2;
  // Writing, or stopped (sent, or the field emptied).
  bool on = 3;
}

// First frame a client sends after the socket opens.
message Hello {
  uint32 protocol_version = 1;
  // Last server cursor the client has applied; 0 for a fresh install.
  uint64 cursor = 2;
}

// Reply to Hello once the server accepts the protocol version. Every
// change after the client's cursor follows as Changes.
message Welcome {
  // Current head of the DO's change log.
  uint64 cursor = 1;
  // The server's time as it sent Welcome, ms since the Unix epoch: the
  // device corrects its clock by it (spec/sync-protocol.md, HLC).
  int64 server_ms = 2;
}

message Ping {
  uint32 nonce = 1;
}

message Pong {
  uint32 nonce = 1;
}

message ServerError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    // The client must update before it can sync. The server closes the socket.
    CODE_PROTOCOL_TOO_OLD = 1;
    // The frame could not be decoded, or Hello was not sent first.
    CODE_BAD_FRAME = 2;
    // An edit's clock runs more than syncLimits.clockAheadMs
    // (design/src/limits.ts) past the server's time. Nothing in the frame
    // is taken and the server closes the socket; the device corrects its
    // clock and the edits' (spec/sync-protocol.md, HLC) and sends them
    // again.
    CODE_CLOCK_AHEAD = 3;
  }

  Code code = 1;
  string message = 2;
}

// A point on a hybrid logical clock: compared by physical_ms, then
// counter, then device_id (spec/sync-protocol.md, HLC). device_id is the
// device's own id in ASCII letters, digits and "-" (a UUID), or "server"
// for the server's corrections.
message Hlc {
  int64 physical_ms = 1;
  uint32 counter = 2;
  string device_id = 3;
}

// A field of a day's shift. Each is its own last-writer-wins value.
enum DayField {
  DAY_FIELD_UNSPECIFIED = 0;
  // The shift pattern's id.
  DAY_FIELD_PATTERN = 1;
  // "HH:MM", set only when the day's time differs from its pattern's.
  DAY_FIELD_START = 2;
  DAY_FIELD_END = 3;
  // The day's memo, private to its owner; dayNote characters at most
  // (design/src/limits.ts).
  DAY_FIELD_NOTE = 4;
  // The day's people: coworker ids separated by spaces, in the order they
  // were added. Private to their owner, like the memo.
  DAY_FIELD_PEOPLE = 5;
}

// One field of one day, as a device set it or as the server holds it.
message DayValue {
  // The day, "YYYY-MM-DD".
  string date = 1;
  DayField field = 2;
  // Unset clears the field. A day with no pattern follows its repeating
  // order, if any; a pattern of "" (dayRules.noShift, design/src/days.ts)
  // is a day with no shift
  // (spec/sync-protocol.md, Repeating orders).
  optional string value = 3;
  Hlc hlc = 4;
}

// Edits from the owner's outbox, in the order they were made.
message DayEdits {
  repeated DayEdit edits = 1;
}

message DayEdit {
  // Unique per edit, so its acknowledgement finds it in the outbox.
  string op_id = 1;
  DayValue value = 2;
}

message Acked {
  repeated string op_ids = 1;
}

message Changes {
  repeated Change changes = 1;
}

// A value as the DO now holds it, at the cursor it got when it last
// changed.
message Change {
  uint64 cursor = 1;
  oneof kind {
    DayValue day = 2;
    PatternValue pattern = 3;
    PatternOrder pattern_order = 4;
    // On a Group DO socket: a member's shared days and patterns, as their
    // User DO pushes them (spec/sync-protocol.md, Group projection).
    MemberDay member_day = 5;
    MemberPattern member_pattern = 6;
    RepeatOrders repeat_orders = 7;
    CoworkerValue coworker = 8;
    CoworkerOrder coworker_order = 9;
    // On a Group DO socket: a member's repeating orders, so the group works
    // their days out as their own devices do.
    MemberRepeatOrders member_repeat_orders = 10;
    // On the User DO socket: a group the user is in, for their list of
    // groups (spec/sync-protocol.md, Groups).
    Membership membership = 11;
    // On a Group DO socket: the group's name and mark, and who is in it.
    GroupProfile group_profile = 12;
    Member member = 13;
    // On a Group DO socket: a line of a chat, and how far a member has
    // read one (spec/sync-protocol.md, Chat).
    ChatLine chat_line = 14;
    ReadMark read_mark = 15;
    // On the User DO socket: how many of a chat's lines the user has not
    // read, from the group, for badges without a socket to each group
    // (spec/sync-protocol.md, Unread summary).
    UnreadCount unread_count = 16;
    // Someone the user has blocked, or no longer (spec/chat.md, Reporting
    // and blocking); User DO only.
    Block block = 17;
    // A chat whose notifications the user turned off, or on again, and
    // whether mentions notify in one turned off (spec/chat.md,
    // Notifications); User DO only.
    ChatMute chat_mute = 18;
    ChatNotifications chat_notifications = 19;
    // The user's usual name, which new groups start with
    // (spec/sync-protocol.md, Profile); User DO only.
    Profile profile = 20;
    // One of the user's preferences, as one of their devices last set it
    // (spec/sync-protocol.md, Preferences); User DO only.
    PreferenceValue preference = 21;
  }
}

// The user's usual name (いつもの名前), kept with the account: each group
// shows it unless the user gave that group a name of its own, and hears of
// it from the User DO as it hears of their shifts. Before the user sets
// one, none is sent.
message Profile {
  // personName characters at most (design/src/limits.ts); empty for none.
  string name = 1;
  // The usual photo, one of the user's own photos (/v1/me/photos/{id});
  // empty for none.
  string photo_id = 2;
}

// A chat whose notifications the user turned off, or back on: one value
// per chat, the latest.
message ChatMute {
  string group_id = 1;
  string thread_id = 2;
  // Off, or on again since.
  bool muted = 3;
}

// The user's chat notification settings for the whole account. Before
// the user sets them, none is sent, and mentions notify.
message ChatNotifications {
  // メンションはいつも通知: a line mentioning the user notifies, and
  // counts, in a chat turned off.
  bool mentions_when_muted = 1;
}

// Someone the user has blocked, in every group they share: one value per
// person, the latest.
message Block {
  string user_id = 1;
  // Blocked, or unblocked since.
  bool on = 2;
}

// How many lines of a group's chat the user has not read: others' lines
// past their read mark. One value per chat, the group's latest.
message UnreadCount {
  string group_id = 1;
  string thread_id = 2;
  uint32 count = 3;
  // How many of them mention the user: what counts, and notifies, in a
  // chat turned off (spec/chat.md, Unread lines).
  uint32 mentions = 4;
}

// A group the user is in, with its name and mark as their User DO last
// heard them, so their list of groups needs no socket to each group.
message Membership {
  string group_id = 1;
  // groupName characters at most (design/src/limits.ts).
  string name = 2;
  reserved 3;
  reserved "emoji";
  GroupMark mark = 6;
  // When the user joined, in ms since the epoch: the list's order.
  int64 joined_at_ms = 4;
  // The user left the group: it goes from their list, with what the
  // device holds of it.
  bool left = 5;
}

// The group's name and mark, as its members see them: one value.
message GroupProfile {
  // groupName characters at most (design/src/limits.ts).
  string name = 1;
  reserved 2;
  reserved "emoji";
  GroupMark mark = 3;
}

// Someone in the group, as they appear in it.
message Member {
  string user_id = 1;
  // personName characters at most (design/src/limits.ts).
  string display_name = 2;
  // When they joined, in ms since the epoch: the group's order of members.
  int64 joined_at_ms = 3;
  // They left the group: they go from it, with their shifts.
  bool left = 4;
  // Their account is deleted: left, with no name, and every line they
  // wrote taken back (spec/sync-protocol.md, Deleting an account).
  bool deleted = 5;
  // display_name is a name of their own for this group (このグループだけ),
  // not their usual one, which it follows otherwise (spec/sync-protocol.md,
  // Profile).
  bool own_name = 6;
  // Their photo as the group shows it, one of the group's photos (its own
  // for them, else their usual one); empty for none.
  string photo_id = 7;
  // photo_id is the group's own for them, or none on purpose, rather than
  // their usual one.
  bool own_photo = 8;
}

// One field of a member's day, as the group sees it: pattern and times,
// never the memo or the people.
message MemberDay {
  string user_id = 1;
  DayValue day = 2;
}

// One of a member's patterns, so the group can draw their marks.
message MemberPattern {
  string user_id = 1;
  PatternValue pattern = 2;
}

// A shift pattern, as spec/shift-patterns.md has it.
message Pattern {
  // shiftName characters at most (design/src/limits.ts).
  string name = 1;
  // The mark in each look: one emoji, letters (1 to shiftMark characters,
  // not blank) and an icon by the apps' own name for it.
  string emoji = 2;
  string symbol = 3;
  string icon = 4;
  // The mark's color slot, an index into the mark palette.
  uint32 color = 5;
  // The standard time, "HH:MM", both or neither; none is all-day. An end
  // at or before the start runs past midnight.
  optional string start = 6;
  optional string end = 7;
  // Counted among the month's days off, and marked as one.
  bool counts_as_off = 8;
  // Another pattern's id, entered on the following day too.
  optional string next_day = 9;
}

// One of the owner's patterns as a device set it, whole: each is one
// last-writer-wins value.
message PatternValue {
  string id = 1;
  // Unset: the pattern was deleted.
  optional Pattern pattern = 2;
  Hlc hlc = 3;
}

// The order the owner's patterns are shown in, ポチポチ入力's buttons: one
// last-writer-wins value.
message PatternOrder {
  repeated string ids = 1;
  Hlc hlc = 2;
}

message PatternEdits {
  repeated PatternEdit edits = 1;
}

message PatternEdit {
  // Unique per edit, as a DayEdit's.
  string op_id = 1;
  oneof kind {
    PatternValue pattern = 2;
    PatternOrder order = 3;
  }
}

// A repeating order of the owner's patterns (spec/shift-patterns.md,
// Repeating orders).
message RepeatOrder {
  // The first day it applies, "YYYY-MM-DD".
  string start = 1;
  // A day that falls on the sequence's first shift, "YYYY-MM-DD"; unset,
  // the start.
  optional string anchor = 2;
  // Pattern ids, one a day. Empty: repeating ends from the start, and days
  // are entered by hand.
  repeated string sequence = 3;
  // 祝日は休みにする: the national holidays of holiday_country take
  // holiday_shift in place of the sequence's shift.
  bool holidays_off = 4;
  // The day-off pattern holidays take, the person's first one when
  // holidays_off was turned on; set whenever holidays_off is.
  optional string holiday_shift = 5;
  // Whose holidays, as a country code ("JP"): the device's region when the
  // order was made.
  string holiday_country = 6;
}

// The owner's repeating orders as one last-writer-wins value: a timeline,
// starts in increasing order, each taking over from the one before.
message RepeatOrders {
  repeated RepeatOrder orders = 1;
  Hlc hlc = 2;
}

message RepeatOrdersEdits {
  repeated RepeatOrdersEdit edits = 1;
}

// Starting an order, or correcting the one in use (spec/sync-protocol.md,
// Repeating orders).
message RepeatOrdersEdit {
  // Unique per edit, as a DayEdit's.
  string op_id = 1;
  RepeatOrders orders = 2;
  // The new or corrected order's start: when the server takes the orders,
  // the days from it give their own pattern and times back to the order,
  // those older than the edit's clock. Unset clears nothing.
  optional string clear_from = 3;
}

// A member's repeating orders, as the group sees them.
message MemberRepeatOrders {
  string user_id = 1;
  RepeatOrders orders = 2;
}

// One of the owner's coworkers, the people they note on a day: a name
// only, not an app user. Each is one last-writer-wins value.
message CoworkerValue {
  string id = 1;
  // personName characters at most (design/src/limits.ts). Unset: deleted.
  optional string name = 2;
  Hlc hlc = 3;
}

// The order the owner's coworkers are listed in: one last-writer-wins
// value.
message CoworkerOrder {
  repeated string ids = 1;
  Hlc hlc = 2;
}

message CoworkerEdits {
  repeated CoworkerEdit edits = 1;
}

message CoworkerEdit {
  // Unique per edit, as a DayEdit's.
  string op_id = 1;
  oneof kind {
    CoworkerValue coworker = 2;
    CoworkerOrder order = 3;
  }
}

// One of the owner's preferences, how they like their screens: one
// last-writer-wins value a key, kept with the account so each of their
// devices shows the same (spec/sync-protocol.md, Preferences). The server
// keeps what it is given without reading it; the apps read the value.
message PreferenceValue {
  // Which preference, as the apps name it: an id (syncLimits.idLength).
  string key = 1;
  // As the apps write it, JSON, syncLimits.preferenceLength characters at
  // most. Unset: none kept, so each device keeps its own.
  optional string value = 2;
  Hlc hlc = 3;
}

message PreferenceEdits {
  repeated PreferenceEdit edits = 1;
}

message PreferenceEdit {
  // Unique per edit, as a DayEdit's.
  string op_id = 1;
  PreferenceValue value = 2;
}

message Reset {}

// A line of a chat as the group holds it, at the cursor it got when it was
// written or last changed. A chat is the group's own (thread_id "group").
message ChatLine {
  string thread_id = 1;
  // Its place in the chat, from 1, given by the group as it takes it.
  uint64 seq = 2;
  // Who wrote it; it stays theirs after they leave.
  string author_id = 3;
  // chatMessage characters at most (design/src/limits.ts); empty for a
  // line of shared days, and once unsent.
  string text = 4;
  // When the group took it, in ms since the epoch.
  int64 sent_at_ms = 5;
  // Its words were changed after it was sent (編集済み).
  bool edited = 6;
  // Taken back by its writer (送信取消): its words are gone for everyone.
  bool unsent = 7;
  // The op_id of the edit that sent it, so the sending device puts the
  // group's line in place of the one it showed while it waited.
  string op_id = 8;
  // Its reactions, each emoji with who chose it in the order they did,
  // the emoji in the order first chosen; none once unsent.
  repeated ChatReaction reactions = 9;
  // Pinned for everyone in the chat: the group's cursor when it was last
  // pinned, so the latest pin is the greatest; 0 when not pinned.
  uint64 pinned_order = 10;
  // The days it shares with everyone's shifts, as YYYY-MM-DD in order; a
  // line of days has no words. None once unsent.
  repeated string days = 11;
  // Its days are put to the vote (spec/chat.md, Polls), in a group chat.
  bool poll = 12;
  // A poll's votes: each day someone can come, with who can, in the
  // order they said so. None once unsent.
  repeated ChatVotes votes = 13;
  // The day a poll was settled on, as YYYY-MM-DD; empty while open.
  string decided = 14;
  // A photo sent as the line, with no words; none once unsent.
  ChatPhoto photo = 15;
  // Its first link's page, under its words; none once unsent.
  LinkPreview preview = 16;
  // Sent in a one-to-one chat by someone the reader had blocked: never
  // delivered to them, so it comes without its content and shows nothing.
  bool hidden = 17;
  // The line it answers (返信), by its seq in the same chat; 0 for none,
  // and none once unsent.
  uint64 reply_to = 18;
}

// A photo in a chat (spec/chat.md, Photos): uploaded by its sender to the
// group's photos (PUT /v1/groups/{group_id}/photos/{id}) before the line
// is sent, and read from there by the group's members. Its size is sent
// with it, so the line keeps its place before the photo arrives.
message ChatPhoto {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
}

// Who can come on one of a poll's days.
message ChatVotes {
  string day = 1;
  repeated string user_ids = 2;
}

// One emoji on a line and the members who chose it.
message ChatReaction {
  // One emoji, as a mark's (spec/text-limits.md, isEmoji).
  string emoji = 1;
  repeated string user_ids = 2;
}

// How far a member has read a chat: every line up to last_read_seq.
message ReadMark {
  string user_id = 1;
  string thread_id = 2;
  uint64 last_read_seq = 3;
}

message ChatEdits {
  repeated ChatEdit edits = 1;
}

// One of a member's edits of a chat, which the group takes in the order it
// arrives; lines and their changes need no clock, as the group alone
// orders them.
message ChatEdit {
  // Unique per edit, as a DayEdit's: a send taken twice is one line.
  string op_id = 1;
  oneof kind {
    ChatSend send = 2;
    ChatChange change = 3;
    ChatUnsend unsend = 4;
    ChatRead read = 5;
    ChatReact react = 6;
    ChatPin pin = 7;
    ChatVote vote = 8;
    ChatDecide decide = 9;
  }
}

// The member can come on one of a poll's days (行ける), or takes it
// back: anyone in the group, on as many days as they like, until the
// poll is settled.
message ChatVote {
  string thread_id = 1;
  uint64 seq = 2;
  string day = 3;
  bool on = 4;
}

// A poll settled on one of its days (日にちを決める, 決め直す), by its
// writer, or by anyone once they have left the group. It pins the poll.
message ChatDecide {
  string thread_id = 1;
  uint64 seq = 2;
  string day = 3;
}

// A line pinned for everyone in the chat, or its pin taken off, by any
// member (spec/chat.md, Pins): at most chatRules.maxPins at once, a new
// one taking the place of the oldest; pinning a pinned line moves it up.
message ChatPin {
  string thread_id = 1;
  uint64 seq = 2;
  // Pinned, or taken off.
  bool on = 3;
}

// The member's reaction on a line, put on or taken off: anyone's line but
// one taken back, any emoji, as many as they like.
message ChatReact {
  string thread_id = 1;
  uint64 seq = 2;
  string emoji = 3;
  // On, or taken back.
  bool on = 4;
}

// A new line at the end of the chat: words, or days shared with
// everyone's shifts (spec/chat.md, Long messages and shared days).
message ChatSend {
  string thread_id = 1;
  // 1 to chatMessage characters, not blank; empty for days.
  string text = 2;
  // 1 to SHARED_DAYS_MAX days (design/src/limits.ts), as YYYY-MM-DD,
  // each once and in order; none for words.
  repeated string days = 3;
  // The days put to the vote instead: 2 days at least, in the group chat.
  bool poll = 4;
  // A photo instead, the sender's own, uploaded first; no words or days.
  ChatPhoto photo = 5;
  // The page of the words' first link, as GetLinkPreview gave it; none
  // when the sender took it off (×) or it had not come.
  LinkPreview preview = 6;
  // The line it answers (返信), an earlier one of the same chat; 0 for none.
  uint64 reply_to = 7;
}

// New words for one of the member's own lines of words (編集).
message ChatChange {
  string thread_id = 1;
  uint64 seq = 2;
  // 1 to chatMessage characters, not blank.
  string text = 3;
  // The words' first link is the line's still: its page stays, and
  // `preview` is not looked at (spec/vectors/chat.json, edited).
  bool keeps_preview = 4;
  // Else the new first link's page, or none.
  LinkPreview preview = 5;
}

// One of the member's own lines taken back (送信取消).
message ChatUnsend {
  string thread_id = 1;
  uint64 seq = 2;
}

// The member has read the chat up to here; the group only moves a mark
// forward.
message ChatRead {
  string thread_id = 1;
  uint64 last_read_seq = 2;
}

message ChatPageRequest {
  string thread_id = 1;
  // The lines before this one; 0 for the latest.
  uint64 before_seq = 2;
}

// Up to chatRules.pageSize lines of a chat before the asked one, oldest
// first.
message ChatPage {
  string thread_id = 1;
  uint64 before_seq = 2;
  repeated ChatLine lines = 3;
  // The page reaches the chat's first line.
  bool at_start = 4;
}
