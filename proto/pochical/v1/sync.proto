syntax = "proto3";

package pochical.v1;

// Every binary WebSocket message from a client is one ClientFrame.
message ClientFrame {
  oneof kind {
    Hello hello = 1;
    Ping ping = 2;
    // The owner's own day edits, from their outbox; User DO socket only.
    DayEdits day_edits = 3;
    // The owner's pattern edits, from the same outbox; User DO socket only.
    PatternEdits pattern_edits = 4;
  }
}

// Every binary WebSocket message from the server is one ServerFrame.
message ServerFrame {
  oneof kind {
    Welcome welcome = 1;
    Pong pong = 2;
    ServerError error = 3;
    // Changes to the DO's data in cursor order, after Welcome and as they
    // happen.
    Changes changes = 4;
    // The edits of a DayEdits or PatternEdits the server has taken; the
    // client deletes them from its outbox.
    Acked acked = 5;
    // The client's cursor is ahead of the server's: drop this DO's cache.
    // A Changes with everything the DO holds follows.
    Reset reset = 6;
  }
}

// First frame a client sends after the socket opens.
message Hello {
  uint32 protocol_version = 1;
  // Last server cursor the client has applied; 0 for a fresh install.
  uint64 cursor = 2;
}

// Reply to Hello once the server accepts the protocol version. Every
// change after the client's cursor follows as Changes.
message Welcome {
  // Current head of the DO's change log.
  uint64 cursor = 1;
}

message Ping {
  uint32 nonce = 1;
}

message Pong {
  uint32 nonce = 1;
}

message ServerError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    // The client must update before it can sync. The server closes the socket.
    CODE_PROTOCOL_TOO_OLD = 1;
    // The frame could not be decoded, or Hello was not sent first.
    CODE_BAD_FRAME = 2;
  }

  Code code = 1;
  string message = 2;
}

// A point on a hybrid logical clock: compared by physical_ms, then
// counter, then device_id (spec/sync-protocol.md, HLC).
message Hlc {
  int64 physical_ms = 1;
  uint32 counter = 2;
  string device_id = 3;
}

// A field of a day's shift. Each is its own last-writer-wins value.
enum DayField {
  DAY_FIELD_UNSPECIFIED = 0;
  // The shift pattern's id.
  DAY_FIELD_PATTERN = 1;
  // "HH:MM", set only when the day's time differs from its pattern's.
  DAY_FIELD_START = 2;
  DAY_FIELD_END = 3;
  // The day's memo, private to its owner; dayNote characters at most
  // (design/src/limits.ts).
  DAY_FIELD_NOTE = 4;
}

// One field of one day, as a device set it or as the server holds it.
message DayValue {
  // The day, "YYYY-MM-DD".
  string date = 1;
  DayField field = 2;
  // Unset clears the field; a day with every field cleared has no shift.
  optional string value = 3;
  Hlc hlc = 4;
}

// Edits from the owner's outbox, in the order they were made.
message DayEdits {
  repeated DayEdit edits = 1;
}

message DayEdit {
  // Unique per edit, so its acknowledgement finds it in the outbox.
  string op_id = 1;
  DayValue value = 2;
}

message Acked {
  repeated string op_ids = 1;
}

message Changes {
  repeated Change changes = 1;
}

// A value as the DO now holds it, at the cursor it got when it last
// changed.
message Change {
  uint64 cursor = 1;
  oneof kind {
    DayValue day = 2;
    PatternValue pattern = 3;
    PatternOrder pattern_order = 4;
    // On a Group DO socket: a member's shared days and patterns, as their
    // User DO pushes them (spec/sync-protocol.md, Group projection).
    MemberDay member_day = 5;
    MemberPattern member_pattern = 6;
  }
}

// One field of a member's day, as the group sees it: pattern and times,
// never the memo.
message MemberDay {
  string user_id = 1;
  DayValue day = 2;
}

// One of a member's patterns, so the group can draw their marks.
message MemberPattern {
  string user_id = 1;
  PatternValue pattern = 2;
}

// A shift pattern, as spec/shift-patterns.md has it.
message Pattern {
  // shiftName characters at most (design/src/limits.ts).
  string name = 1;
  // The mark in each look: an emoji, a letter (shiftMark characters) and
  // an icon by the apps' own name for it.
  string emoji = 2;
  string symbol = 3;
  string icon = 4;
  // The mark's color slot, an index into the mark palette.
  uint32 color = 5;
  // The standard time, "HH:MM", both or neither; none is all-day. An end
  // at or before the start runs past midnight.
  optional string start = 6;
  optional string end = 7;
  // Counted among the month's days off, and marked as one.
  bool counts_as_off = 8;
  // Another pattern's id, entered on the following day too.
  optional string next_day = 9;
}

// One of the owner's patterns as a device set it, whole: each is one
// last-writer-wins value.
message PatternValue {
  string id = 1;
  // Unset: the pattern was deleted.
  optional Pattern pattern = 2;
  Hlc hlc = 3;
}

// The order the owner's patterns are shown in, ポチポチ入力's buttons: one
// last-writer-wins value.
message PatternOrder {
  repeated string ids = 1;
  Hlc hlc = 2;
}

message PatternEdits {
  repeated PatternEdit edits = 1;
}

message PatternEdit {
  // Unique per edit, as a DayEdit's.
  string op_id = 1;
  oneof kind {
    PatternValue pattern = 2;
    PatternOrder order = 3;
  }
}

message Reset {}
