syntax = "proto3";

package pochical.v1;

import "pochical/v1/marks.proto";

// The signed-in user. Every call here needs the session token from
// better-auth (/api/auth) as `Authorization: Bearer <token>`; without a
// valid one it fails with UNAUTHENTICATED.
service UserService {
  // Deletes the user's account and everything of it (spec/sync-protocol.md,
  // Deleting an account): their own values, their place in each group with
  // every line they wrote taken back, their chat with Pochical's people,
  // and their sign-ins. A user linked to Sign in with Apple sends a fresh
  // authorization code, with which the server revokes the app's Apple
  // tokens as Apple asks; FAILED_PRECONDITION without one Apple takes. A
  // user linked to Google sends none, as the server holds no Google token
  // to revoke.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // What the account a provider's ID token is of holds, when it is linked
  // to another user than the caller (spec/sync-protocol.md, Switching to
  // an account in use): the ID token, with the nonce it was asked with,
  // proves the person holds it. NOT_FOUND when the account is no other
  // user's; UNAUTHENTICATED for a token that does not check out;
  // INVALID_ARGUMENT for no provider.
  rpc PeekAccount(PeekAccountRequest) returns (PeekAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Keeps this device's data: the account's user is deleted, everything
  // of it with it, and its provider's account linked to the caller
  // instead, in one call. As PeekAccount for the token.
  rpc TakeAccount(TakeAccountRequest) returns (TakeAccountResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Who the token belongs to, for the apps to check a stored session.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Blocks someone in every group the two share, or unblocks them
  // (spec/chat.md, Reporting and blocking); their devices hear of it as a
  // Block change. Blocking oneself is INVALID_ARGUMENT.
  rpc SetBlocked(SetBlockedRequest) returns (SetBlockedResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Keeps a device's push token for the user's notifications (spec/chat.md,
  // Notifications); sent each launch, as iOS and FCM may change it.
  // INVALID_ARGUMENT for a token not of its platform's shape.
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (RegisterPushTokenResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Turns a chat's notifications off or on again (spec/chat.md,
  // Notifications); the user's devices hear of it as a ChatMute change.
  // NOT_FOUND for a group the user is not in or a chat not theirs.
  rpc SetChatMuted(SetChatMutedRequest) returns (SetChatMutedResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Sets メンションはいつも通知 for the account; the devices hear of it as a
  // ChatNotifications change.
  rpc SetChatNotifications(SetChatNotificationsRequest) returns (SetChatNotificationsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Sets the user's usual name and photo, each empty for none; the devices
  // hear of it as a Profile change. INVALID_ARGUMENT over personName
  // characters, or for a photo the user has not uploaded.
  rpc SetProfile(SetProfileRequest) returns (SetProfileResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Sets the shape the user's marks are drawn in, which their groups show
  // (spec/sync-protocol.md, Profile); the devices hear of it as a Profile
  // change. INVALID_ARGUMENT for a style that is none of the three.
  rpc SetMarkLook(SetMarkLookRequest) returns (SetMarkLookResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message SetChatMutedRequest {
  string group_id = 1;
  // "group" for the group's chat, or a one-to-one chat the user is in.
  string thread_id = 2;
  bool muted = 3;
}

message SetChatMutedResponse {}

message SetChatNotificationsRequest {
  bool mentions_when_muted = 1;
}

message SetChatNotificationsResponse {}

message SetProfileRequest {
  // The usual name, empty for none; unset keeps the one set before, so a
  // device changing only the photo cannot undo another's new name.
  optional string name = 1;
  // One of the user's own photos, uploaded to /v1/me/photos/{id} first,
  // empty for none; unset keeps the one set before.
  optional string photo_id = 2;
}

message SetProfileResponse {}

message SetMarkLookRequest {
  MarkLook look = 1;
}

message SetMarkLookResponse {}

message RegisterPushTokenRequest {
  // The device's token: APNs' as hex, or FCM's registration token.
  string token = 1;
  // From an iOS development build: sent through APNs' sandbox. Never for
  // FCM, which has none.
  bool sandbox = 2;
  // Whose token it is, which the server sends through.
  PushPlatform platform = 3;
}

// The push service a device's notifications go through (spec/sync-protocol.md,
// Push).
enum PushPlatform {
  PUSH_PLATFORM_UNSPECIFIED = 0;
  // Apple's, for iOS.
  PUSH_PLATFORM_APNS = 1;
  // Firebase Cloud Messaging, for Android.
  PUSH_PLATFORM_FCM = 2;
}

message RegisterPushTokenResponse {}

message SetBlockedRequest {
  string user_id = 1;
  bool blocked = 2;
}

message SetBlockedResponse {}

message GetMeRequest {}

message GetMeResponse {
  string user_id = 1;
  // Signed in without Apple or Google yet; linking one keeps the user.
  bool anonymous = 2;
  // The provider the user is linked to; unspecified while anonymous.
  SignInProvider provider = 3;
}

// Where a person signs in besides anonymously (spec/sync-protocol.md,
// Signing in).
enum SignInProvider {
  SIGN_IN_PROVIDER_UNSPECIFIED = 0;
  SIGN_IN_PROVIDER_APPLE = 1;
  SIGN_IN_PROVIDER_GOOGLE = 2;
}

// A provider's ID token as the app got it signing in, which proves the
// person holds the provider's account.
message ProviderToken {
  SignInProvider provider = 1;
  string id_token = 2;
  // The nonce the app asked the provider with.
  string nonce = 3;
}

message DeleteAccountRequest {
  // Sign in with Apple's authorization code, asked for again just before
  // deleting; empty for a user not linked to Apple.
  string apple_authorization_code = 1;
  // True when the code came through Apple's web page (Android's), given
  // to the server's Services ID rather than the iOS app: Apple takes a
  // code only from the client it gave it to.
  bool apple_code_from_web = 2;
}

message DeleteAccountResponse {}

message PeekAccountRequest {
  reserved 1, 2;
  reserved "apple_id_token", "nonce";
  ProviderToken account = 3;
}

// What a user holds that the person entered, for telling a few taps tried
// from months of use.
message PeekAccountResponse {
  // Days with a shift of their own.
  int32 shift_days = 1;
  // A repeating order is set.
  bool repeating = 2;
  int32 coworkers = 3;
  // Groups they are in.
  int32 groups = 4;
}

message TakeAccountRequest {
  reserved 1, 2;
  reserved "apple_id_token", "nonce";
  ProviderToken account = 3;
}

message TakeAccountResponse {}
