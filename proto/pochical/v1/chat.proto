syntax = "proto3";

package pochical.v1;

// What a chat asks the server beyond its socket (spec/chat.md).
service ChatService {
  // A link's preview, read by the server so people's addresses are not
  // sent to the sites (spec/chat.md, Reading a page), cached by URL for a
  // day. Signed-in users only. The preview is unset when no page was
  // found; INVALID_ARGUMENT for a URL that is not http(s) on 80 or 443.
  rpc GetLinkPreview(GetLinkPreviewRequest) returns (GetLinkPreviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Tells Pochical about another member's line or about the member
  // (spec/chat.md, Reporting and blocking): kept with what was reported,
  // and nobody in the group is told. Members of the group only, about
  // someone else; NOT_FOUND for a line the reporter cannot read.
  rpc Report(ReportRequest) returns (ReportResponse);
}

// Why something is reported (spec/chat.md, Reporting and blocking).
enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  // 迷惑・スパム
  REPORT_REASON_SPAM = 1;
  // 嫌がらせ・いじめ
  REPORT_REASON_HARASSMENT = 2;
  // 性的・暴力的な内容
  REPORT_REASON_EXPLICIT = 3;
  // なりすまし
  REPORT_REASON_IMPERSONATION = 4;
  // その他
  REPORT_REASON_OTHER = 5;
}

message ReportRequest {
  string group_id = 1;
  ReportReason reason = 2;
  oneof target {
    // Someone else's line, sent with the few around it.
    ReportedLine line = 3;
    // A member, sent with their name in the group.
    string user_id = 4;
  }
}

message ReportedLine {
  string thread_id = 1;
  uint64 seq = 2;
}

message ReportResponse {}

message GetLinkPreviewRequest {
  string url = 1;
}

message GetLinkPreviewResponse {
  LinkPreview preview = 1;
}

// A link's page as a message carries it, sent with the message so every
// reader sees the same and none of them fetches the page.
message LinkPreview {
  // The link it is for, the message's first.
  string url = 1;
  // og:title, else <title>, else the address without its scheme.
  string title = 2;
  // og:site_name, else the host without www.
  string site = 3;
  // The page's picture as the server keeps it (GET /v1/previews/{id});
  // empty for none.
  string image_id = 4;
  uint32 image_width = 5;
  uint32 image_height = 6;
}
