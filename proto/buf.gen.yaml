version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: java_package_prefix
      value: tech.chiji
plugins:
  # Workers (connect-es). Runs the protoc-gen-es version pinned in apps/server.
  - local: ../node_modules/.bin/protoc-gen-es
    out: ../apps/server/src/gen
    include_imports: false
    opt:
      - target=ts
  # iOS (swift-protobuf + connect-swift)
  - remote: buf.build/apple/swift:v1.38.1
    out: ../apps/ios/Packages/PochicalProto/Sources/PochicalProto
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
  - remote: buf.build/connectrpc/swift:v1.2.3
    out: ../apps/ios/Packages/PochicalProto/Sources/PochicalProto
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
      - GenerateCallbackMethods=false
  # Android (protobuf lite + connect-kotlin)
  - remote: buf.build/protocolbuffers/java:v36.2
    out: ../apps/android/proto/src/main/java
    opt:
      - lite
  - remote: buf.build/protocolbuffers/kotlin:v36.2
    out: ../apps/android/proto/src/main/kotlin
    opt:
      - lite
  - remote: buf.build/connectrpc/kotlin:v0.9.0
    out: ../apps/android/proto/src/main/kotlin
    opt:
      - generateCallbackMethods=false
      - generateCoroutineMethods=true
